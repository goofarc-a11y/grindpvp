services:
  - type: web
    name: grindpvp-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: grindpvp-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://grindpvp-blsu.onrender.com

  - type: web
    name: grindpvp-website
    runtime: static
    rootDir: Website
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://grindpvp-backend-1.onrender.com

databases:
  - name: grindpvp-db
    databaseName: grindpvp
    user: grindpvp
